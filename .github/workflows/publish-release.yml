name: Publish verified CLI release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (source commit S)
        required: true
        type: string
      evidence_run_id:
        description: Successful Release evidence prepare run at S
        required: true
        type: string
      notes_commit:
        description: Full 40-character notes commit N (S ancestor of N, N ancestor of this run)
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: cli-release-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
      NOTES_COMMIT: ${{ inputs.notes_commit }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify, create once, and read back complete release
        shell: bash
        run: |
          bash tools/release-evidence/publish-release.sh "$RELEASE_TAG" "$EVIDENCE_RUN_ID" "$NOTES_COMMIT" "$RUNNER_TEMP/cli-release-publish"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-release-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cli-release-publish/
          if-no-files-found: warn
