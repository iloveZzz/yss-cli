name: Native verification
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
env:
  YSS_LEGACY_ORACLE_ROOT: ${{ github.workspace }}/template-source
  YSS_NATIVE_SOURCE_ROOT: ${{ github.workspace }}/cli-source
  PYTHONDONTWRITEBYTECODE: 1
jobs:
  native:
    defaults:
      run:
        working-directory: cli-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin-amd64
            binary: yss-bin
          - runner: macos-15
            platform: darwin-arm64
            binary: yss-bin
          - runner: ubuntu-24.04
            platform: linux-amd64
            binary: yss-bin
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            binary: yss-bin
          - runner: windows-2025
            platform: windows-amd64
            binary: yss-bin.exe
          - runner: windows-11-arm
            platform: windows-arm64
            binary: yss-bin.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Preserve committed source bytes on native checkouts
        shell: bash
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          path: cli-source
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli-source/go.mod
          cache-dependency-path: cli-source/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python entry and install governance dependency
        shell: bash
        run: |
          python3 --version
          python3 -m pip install jsonschema==4.23.0
      - name: Read fixed template source
        id: template-source
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const commit = JSON.parse(fs.readFileSync('docs/source-lock.json')).profiles.spec.templateCommit;
          if (!/^[a-f0-9]{40}$/.test(commit)) throw new Error('fixed template commit required');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `commit=${commit}\n`);
          JS
      - name: Checkout fixed template before integration tests
        uses: actions/checkout@v5
        with:
          repository: iloveZzz/yss-spec-project-template
          ref: ${{ steps.template-source.outputs.commit }}
          path: template-source
          submodules: false
          fetch-depth: 1
      - name: Verify fixed template revision
        shell: bash
        run: test "$(git -C "$GITHUB_WORKSPACE/template-source" rev-parse HEAD)" = "${{ steps.template-source.outputs.commit }}"
      - uses: pnpm/action-setup@v4
        with:
          version: '10.15.0'
      - name: Install fixed governance tooling
        shell: bash
        run: pnpm --dir "$GITHUB_WORKSPACE/template-source/.template-source/tooling/node" install --frozen-lockfile
      - name: Build the exact native release candidate
        shell: bash
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p "$RUNNER_TEMP/yss-release-native"
          binary="$RUNNER_TEMP/yss-release-native/${{ matrix.binary }}"
          go build -trimpath -buildvcs=false -ldflags="-s -w -X github.com/iloveZzz/yss-cli/internal/domain.BuildCommit=$GITHUB_SHA -X github.com/iloveZzz/yss-cli/internal/domain.BuildSourceState=committed" -o "$binary" ./cmd/yss
          node --input-type=module - "$binary" <<'JS'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const binary = process.argv[2];
          const digest = createHash('sha256').update(fs.readFileSync(binary)).digest('hex');
          fs.appendFileSync(process.env.GITHUB_ENV, `YSS_NATIVE_BINARY=${binary}\nYSS_NATIVE_BINARY_SHA256=${digest}\n`);
          JS
      - run: go test -timeout=60m -count=1 ./...
      - run: go vet ./...
      - run: go mod verify
      - name: Verify Windows AMD64 race compiler
        if: matrix.platform == 'windows-amd64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = 'C:\mingw64\bin\gcc.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Required runner MinGW compiler is missing: $compiler"
          }
          $target = (& $compiler -dumpmachine).Trim()
          if ($LASTEXITCODE -ne 0 -or $target -ne 'x86_64-w64-mingw32') {
            throw "Required Windows AMD64 compiler target is unavailable: $target"
          }
          & $compiler --version
          if ($LASTEXITCODE -ne 0) { throw 'MinGW compiler version command failed' }
          $library = (& $compiler --print-file-name libsynchronization.a).Trim()
          if ($LASTEXITCODE -ne 0 -or -not [IO.Path]::IsPathRooted($library) -or
              -not (Test-Path -LiteralPath $library -PathType Leaf)) {
            throw "MinGW-w64 runtime 8 or later is required: $library"
          }
          Write-Output "Race compiler: $compiler; target: $target; synchronization library: $library"
          "CC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Split-Path -Parent $compiler) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Race
        if: matrix.platform != 'windows-arm64'
        env:
          CGO_ENABLED: 1
        run: go test -timeout=60m -count=1 -race ./...
      - name: Exact release binary native acceptance
        shell: bash
        run: node tools/native-release-receipt.mjs --binary "$YSS_NATIVE_BINARY" --template-root "$GITHUB_WORKSPACE/template-source" --out "$RUNNER_TEMP" --artifact-prefix "native-${{ matrix.platform }}" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/yss-release-native/*
            ${{ runner.temp }}/native-receipt.json
            ${{ runner.temp }}/native-version.json
            ${{ runner.temp }}/native-inspect-*.json
            ${{ runner.temp }}/*.stdout.log
            ${{ runner.temp }}/*.stderr.log
            ${{ runner.temp }}/yss-native-smoke/*.json
            ${{ runner.temp }}/yss-native-recovery/report.json
            ${{ runner.temp }}/yss-native-recovery/output-*.json
            ${{ runner.temp }}/yss-plugin-native-smoke/report.json
            ${{ runner.temp }}/yss-plugin-native-smoke/*.log
