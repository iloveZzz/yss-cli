name: Native verification
on:
  workflow_dispatch:
    inputs:
      full:
        description: Explicit full Go verification (race is manual)
        type: boolean
        default: false
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  # 预言机裁决回放自 internal/governance/testdata/oracle；锁升级后用 tools/oracle-record 重录。
  YSS_ORACLE_MODE: fixture
  YSS_LEGACY_ORACLE_ROOT: ${{ github.workspace }}/template-source
  YSS_SCHEMA_CORPUS_ROOT: ${{ github.workspace }}/template-source
  YSS_NATIVE_SOURCE_ROOT: ${{ github.workspace }}/cli-source
  PYTHONDONTWRITEBYTECODE: 1
jobs:
  prepare:
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.verification.outputs.matrix }}
      native_required: ${{ steps.verification.outputs.native_required }}
    defaults:
      run:
        working-directory: cli-source
    steps:
      - name: Preserve committed source bytes
        shell: bash
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          path: cli-source
          fetch-depth: 0
      - uses: ./cli-source/.github/actions/native-setup
      - name: Build the exact native release candidate
        shell: bash
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p "$RUNNER_TEMP/yss-release-native"
          binary="$RUNNER_TEMP/yss-release-native/yss-bin"
          go build -trimpath -buildvcs=false -ldflags="-s -w -X github.com/iloveZzz/yss-cli/internal/domain.BuildCommit=$GITHUB_SHA -X github.com/iloveZzz/yss-cli/internal/domain.BuildSourceState=committed" -o "$binary" ./cmd/yss
          node --input-type=module - "$binary" <<'JS'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const binary = process.argv[2];
          const digest = createHash('sha256').update(fs.readFileSync(binary)).digest('hex');
          fs.appendFileSync(process.env.GITHUB_ENV, `YSS_NATIVE_BINARY=${binary}\nYSS_NATIVE_BINARY_SHA256=${digest}\n`);
          JS
      - name: Discover verification selected by changes and dependencies
        id: verification
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL_REQUESTED: ${{ inputs.full }}
        run: |
          base="$EVENT_BASE"
          if ! [[ "$base" =~ ^[a-f0-9]{40}$ ]] || [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
            base=$(git rev-parse HEAD^)
          fi
          args=(--base "$base" --template-root "$GITHUB_WORKSPACE/template-source" --out "$RUNNER_TEMP/yss-release-native/verification-plan.json" --tasks-out "$RUNNER_TEMP/yss-release-native/verification-tasks.json")
          if [[ "$FULL_REQUESTED" == true ]]; then args+=(--full); fi
          node tools/verification-plan.mjs "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-candidate
          if-no-files-found: error
          path: ${{ runner.temp }}/yss-release-native/*
  verify:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        working-directory: cli-source
    steps:
      - name: Preserve committed source bytes
        shell: bash
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          path: cli-source
          fetch-depth: 0
      - uses: ./cli-source/.github/actions/native-setup
      - uses: actions/download-artifact@v4
        with:
          name: native-candidate
          path: ${{ runner.temp }}/yss-release-native
      - name: Restore exact candidate permissions
        shell: bash
        run: |
          chmod 755 "$RUNNER_TEMP/yss-release-native/yss-bin"
          echo "YSS_NATIVE_BINARY=$RUNNER_TEMP/yss-release-native/yss-bin" >> "$GITHUB_ENV"
      - name: Execute verification selected by changes and dependencies
        shell: bash
        run: node tools/verification-tasks.mjs --manifest "$RUNNER_TEMP/yss-release-native/verification-tasks.json" --task "${{ matrix.task }}" --report-dir "$RUNNER_TEMP/verification/${{ matrix.task }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.task }}
          if-no-files-found: error
          path: ${{ runner.temp }}/verification/${{ matrix.task }}
  native:
    needs: [prepare, verify]
    if: always()
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cli-source
    steps:
      - name: Preserve committed source bytes
        shell: bash
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          path: cli-source
          fetch-depth: 0
      - uses: ./cli-source/.github/actions/native-setup
      - uses: actions/download-artifact@v4
        with:
          name: native-candidate
          path: ${{ runner.temp }}/yss-release-native
      - name: Restore exact candidate permissions
        shell: bash
        run: |
          chmod 755 "$RUNNER_TEMP/yss-release-native/yss-bin"
          echo "YSS_NATIVE_BINARY=$RUNNER_TEMP/yss-release-native/yss-bin" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: verification-*
          path: ${{ runner.temp }}/verification
      - name: Require every selected task and test to finish
        shell: bash
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          test "$PREPARE_RESULT" = success
          test "$VERIFY_RESULT" = success
          node tools/verification-tasks.mjs --manifest "$RUNNER_TEMP/yss-release-native/verification-tasks.json" --collect "$RUNNER_TEMP/verification" > "$RUNNER_TEMP/verification-summary.json"
          cat "$RUNNER_TEMP/verification-summary.json"
      - name: Exact release binary native acceptance
        if: needs.prepare.outputs.native_required == 'true'
        shell: bash
        run: node tools/native-release-receipt.mjs --binary "$YSS_NATIVE_BINARY" --template-root "$GITHUB_WORKSPACE/template-source" --out "$RUNNER_TEMP" --artifact-prefix "native-darwin-arm64" --commit "$GITHUB_SHA"
      - name: Windows AMD64 trial compile and size only
        if: needs.prepare.outputs.native_required == 'true'
        shell: bash
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -trimpath -buildvcs=false -ldflags="-s -w -X github.com/iloveZzz/yss-cli/internal/domain.BuildCommit=$GITHUB_SHA -X github.com/iloveZzz/yss-cli/internal/domain.BuildSourceState=committed" -o "$RUNNER_TEMP/yss-release-native/yss-trial-windows-amd64.exe" ./cmd/yss
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const size=fs.statSync(`${process.env.RUNNER_TEMP}/yss-release-native/yss-trial-windows-amd64.exe`).size;
          if(size>35_000_000)throw new Error('Windows AMD64 binary size exceeds limit');
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/windows-trial-size.json`,JSON.stringify({platform:'windows/amd64',size,stableReady:false,nativeRuntimeVerified:false}));
          JS
      - name: Native performance measurement
        shell: bash
        if: needs.prepare.outputs.native_required == 'true'
        run: |
          python3 tools/size-performance.py --self-check
          python3 tools/size-performance.py --binary "$YSS_NATIVE_BINARY" --out "$RUNNER_TEMP/yss-size-performance"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-darwin-arm64
          path: |
            ${{ runner.temp }}/yss-release-native/*
            ${{ runner.temp }}/native-receipt.json
            ${{ runner.temp }}/native-version.json
            ${{ runner.temp }}/native-inspect-*.json
            ${{ runner.temp }}/*.stdout.log
            ${{ runner.temp }}/*.stderr.log
            ${{ runner.temp }}/yss-native-smoke/*.json
            ${{ runner.temp }}/yss-native-recovery/report.json
            ${{ runner.temp }}/yss-native-recovery/output-*.json
            ${{ runner.temp }}/yss-plugin-native-smoke/report.json
            ${{ runner.temp }}/yss-plugin-native-smoke/*.log
            ${{ runner.temp }}/verification-summary.json
            ${{ runner.temp }}/windows-trial-size.json
            ${{ runner.temp }}/yss-size-performance/report.json
