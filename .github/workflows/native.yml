name: Native verification
on:
  workflow_dispatch:
    inputs:
      full:
        description: Explicit full Go and race verification
        type: boolean
        default: false
  push:
  pull_request:
permissions:
  contents: read
env:
  YSS_LEGACY_ORACLE_ROOT: ${{ github.workspace }}/template-source
  YSS_SCHEMA_CORPUS_ROOT: ${{ github.workspace }}/template-source
  YSS_NATIVE_SOURCE_ROOT: ${{ github.workspace }}/cli-source
  PYTHONDONTWRITEBYTECODE: 1
jobs:
  native:
    defaults:
      run:
        working-directory: cli-source
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1.0 qualification is scoped to the user's current darwin/arm64 platform.
          - runner: macos-15
            platform: darwin-arm64
            binary: yss-bin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Preserve committed source bytes on native checkouts
        shell: bash
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          path: cli-source
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli-source/go.mod
          cache-dependency-path: cli-source/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python entry and install governance dependency
        shell: bash
        run: |
          python3 --version
          python3 -m pip install jsonschema==4.23.0
      - name: Read fixed template source
        id: template-source
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const commit = JSON.parse(fs.readFileSync('docs/source-lock.json')).profiles.spec.templateCommit;
          if (!/^[a-f0-9]{40}$/.test(commit)) throw new Error('fixed template commit required');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `commit=${commit}\n`);
          JS
      - name: Checkout fixed template before integration tests
        uses: actions/checkout@v5
        with:
          repository: iloveZzz/yss-spec-project-template
          ref: ${{ steps.template-source.outputs.commit }}
          path: template-source
          submodules: false
          fetch-depth: 1
      - name: Verify fixed template revision
        shell: bash
        run: test "$(git -C "$GITHUB_WORKSPACE/template-source" rev-parse HEAD)" = "${{ steps.template-source.outputs.commit }}"
      - name: Initialize fixed Profile oracles
        shell: bash
        run: git -C "$GITHUB_WORKSPACE/template-source" submodule update --init --depth 1 -- submodules/yss-harness-backend-agent submodules/yss-harness-frontend-agent submodules/yss-harness-design-agent
      - uses: pnpm/action-setup@v4
        with:
          version: '10.15.0'
      - name: Install fixed governance tooling
        shell: bash
        run: |
          pnpm --dir "$GITHUB_WORKSPACE/template-source/.template-source/tooling/node" install --frozen-lockfile
          for profile in backend frontend design; do
            tooling="$GITHUB_WORKSPACE/template-source/submodules/yss-harness-$profile-agent/.template-source/tooling/node"
            if test -f "$tooling/package.json"; then
              pnpm --dir "$tooling" install --frozen-lockfile
            fi
          done
      - name: Build the exact native release candidate
        shell: bash
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p "$RUNNER_TEMP/yss-release-native"
          binary="$RUNNER_TEMP/yss-release-native/${{ matrix.binary }}"
          go build -trimpath -buildvcs=false -ldflags="-s -w -X github.com/iloveZzz/yss-cli/internal/domain.BuildCommit=$GITHUB_SHA -X github.com/iloveZzz/yss-cli/internal/domain.BuildSourceState=committed" -o "$binary" ./cmd/yss
          node --input-type=module - "$binary" <<'JS'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const binary = process.argv[2];
          const digest = createHash('sha256').update(fs.readFileSync(binary)).digest('hex');
          fs.appendFileSync(process.env.GITHUB_ENV, `YSS_NATIVE_BINARY=${binary}\nYSS_NATIVE_BINARY_SHA256=${digest}\n`);
          JS
      - name: Execute verification selected by changes and dependencies
        id: verification
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL_REQUESTED: ${{ inputs.full }}
        run: |
          base="$EVENT_BASE"
          if ! [[ "$base" =~ ^[a-f0-9]{40}$ ]] || [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
            base=$(git rev-parse HEAD^)
          fi
          args=(--base "$base" --template-root "$GITHUB_WORKSPACE/template-source" --out "$RUNNER_TEMP/verification-plan.json" --execute)
          if [[ "$FULL_REQUESTED" == true ]]; then args+=(--full); fi
          node tools/verification-plan.mjs "${args[@]}"
      - name: Exact release binary native acceptance
        if: steps.verification.outputs.native_required == 'true'
        shell: bash
        run: node tools/native-release-receipt.mjs --binary "$YSS_NATIVE_BINARY" --template-root "$GITHUB_WORKSPACE/template-source" --out "$RUNNER_TEMP" --artifact-prefix "native-${{ matrix.platform }}" --commit "$GITHUB_SHA"
      - name: Windows AMD64 trial compile and size only
        if: steps.verification.outputs.native_required == 'true'
        shell: bash
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -trimpath -buildvcs=false -ldflags="-s -w -X github.com/iloveZzz/yss-cli/internal/domain.BuildCommit=$GITHUB_SHA -X github.com/iloveZzz/yss-cli/internal/domain.BuildSourceState=committed" -o "$RUNNER_TEMP/yss-release-native/yss-trial-windows-amd64.exe" ./cmd/yss
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const size=fs.statSync(`${process.env.RUNNER_TEMP}/yss-release-native/yss-trial-windows-amd64.exe`).size;
          if(size>35_000_000)throw new Error('Windows AMD64 binary size exceeds limit');
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/windows-trial-size.json`,JSON.stringify({platform:'windows/amd64',size,stableReady:false,nativeRuntimeVerified:false}));
          JS
      - name: Native performance measurement
        shell: bash
        if: steps.verification.outputs.native_required == 'true'
        run: |
          python3 tools/size-performance.py --self-check
          python3 tools/size-performance.py --binary "$YSS_NATIVE_BINARY" --out "$RUNNER_TEMP/yss-size-performance"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/yss-release-native/*
            ${{ runner.temp }}/native-receipt.json
            ${{ runner.temp }}/native-version.json
            ${{ runner.temp }}/native-inspect-*.json
            ${{ runner.temp }}/*.stdout.log
            ${{ runner.temp }}/*.stderr.log
            ${{ runner.temp }}/yss-native-smoke/*.json
            ${{ runner.temp }}/yss-native-recovery/report.json
            ${{ runner.temp }}/yss-native-recovery/output-*.json
            ${{ runner.temp }}/yss-plugin-native-smoke/report.json
            ${{ runner.temp }}/yss-plugin-native-smoke/*.log
            ${{ runner.temp }}/verification-plan.json
            ${{ runner.temp }}/windows-trial-size.json
            ${{ runner.temp }}/yss-size-performance/report.json
