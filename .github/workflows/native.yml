name: Native verification
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin-amd64
            binary: yss-bin
          - runner: macos-15
            platform: darwin-arm64
            binary: yss-bin
          - runner: ubuntu-24.04
            platform: linux-amd64
            binary: yss-bin
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            binary: yss-bin
          - runner: windows-2025
            platform: windows-amd64
            binary: yss-bin.exe
          - runner: windows-11-arm
            platform: windows-arm64
            binary: yss-bin.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - name: Race
        if: runner.os != 'Windows'
        run: go test -count=1 -race ./...
      - name: Build native binary
        shell: bash
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -o "${{ matrix.binary }}" ./cmd/yss
      - name: No interpreter smoke
        shell: bash
        run: go run ./tools/native-smoke "./${{ matrix.binary }}" "$RUNNER_TEMP/yss-native-smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.platform }}
          path: ${{ runner.temp }}/yss-native-smoke/*.json
