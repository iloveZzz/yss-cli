name: Desktop candidate build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            binary: yss
            bundle: dmg
            extension: dmg
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: yss.exe
            bundle: nsis
            extension: exe
            sidecar-rustflags: '-C target-feature=+crt-static'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    env:
      NODE_VERSION: 24.14.1
      PNPM_VERSION: 10.15.0
      RUSTUP_TOOLCHAIN: 1.99.1
      TAURI_CLI_VERSION: 2.12.6
      YSS_TARGET: ${{ matrix.target }}
      YSS_SIDECAR_RUSTFLAGS: ${{ matrix.sidecar-rustflags }}
      YSS_TEMPLATE_COMMIT: beaafedb77e2dfdb8cfd6433ab4b59dddcefbb92
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false

      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the pinned pnpm and locate its store
        id: pnpm
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm install --global "pnpm@$env:PNPM_VERSION"
          if ((pnpm --version).Trim() -cne $env:PNPM_VERSION) { throw 'Unexpected pnpm version' }
          npm install --prefix (Join-Path $env:RUNNER_TEMP 'tauri-cli') --no-save --no-package-lock --ignore-scripts "@tauri-apps/cli@$env:TAURI_CLI_VERSION"
          $tauri = Join-Path $env:RUNNER_TEMP 'tauri-cli/node_modules/@tauri-apps/cli/tauri.js'
          if ((node $tauri --version).Trim() -cne "tauri-cli $env:TAURI_CLI_VERSION") { throw 'Unexpected Tauri CLI version' }
          "store=$((pnpm store path).Trim())" >> $env:GITHUB_OUTPUT

      - name: Cache the workbench dependency store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: desktop-pnpm-${{ runner.os }}-${{ matrix.target }}-${{ env.NODE_VERSION }}-${{ env.PNPM_VERSION }}-${{ hashFiles('ui/package.json', 'ui/pnpm-lock.yaml', 'ui/pnpm-workspace.yaml') }}

      - name: Install the pinned Rust toolchain
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --target $env:YSS_TARGET

      - name: Restore and cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: desktop-${{ matrix.target }}
          workspaces: |
            . -> target
            desktop -> target
          env-vars: ImageOS ImageVersion SDKROOT DEVELOPER_DIR MACOSX_DEPLOYMENT_TARGET YSS_SIDECAR_RUSTFLAGS
          cache-bin: false
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the workbench and desktop terminal UIs
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm --dir ui install --frozen-lockfile --prefer-offline
          pnpm --dir ui typecheck
          pnpm --dir ui lint
          pnpm --dir ui build
          pnpm --dir ui build:desktop-terminal

      - name: Build and verify the pinned template bundle
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:YSS_TEMPLATE_COMMIT -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid template commit' }
          $template = Join-Path $env:RUNNER_TEMP 'yss-template'
          git init $template
          git -C $template remote add origin https://github.com/iloveZzz/yss-spec-project-template.git
          git -C $template fetch --depth 1 origin $env:YSS_TEMPLATE_COMMIT
          git -C $template -c core.symlinks=true checkout --detach FETCH_HEAD
          if ((git -C $template rev-parse HEAD).Trim() -cne $env:YSS_TEMPLATE_COMMIT) { throw 'Template commit and checkout differ' }
          $bundleReport = cargo run --locked --bin yss-bundle -- --source-root $template --out assets/bundle.tar.gz | ConvertFrom-Json
          if ($bundleReport.source.commit -cne $env:YSS_TEMPLATE_COMMIT -or $bundleReport.source.state -cne 'committed') { throw 'Bundle source is not the pinned clean template commit' }
          $actualBundleDigest = (Get-FileHash assets/bundle.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($bundleReport.sha256 -cne $actualBundleDigest) { throw 'Bundle digest mismatch' }
          $bundleReport | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8NoBOM (Join-Path $env:RUNNER_TEMP 'bundle-build.json')

      - name: Compile the target workbench executable
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:YSS_SIDECAR_RUSTFLAGS) { $env:RUSTFLAGS = $env:YSS_SIDECAR_RUSTFLAGS }
          cargo build --locked --release --bin yss --target $env:YSS_TARGET
          New-Item -ItemType Directory desktop/binaries -Force | Out-Null
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          Copy-Item "target/$env:YSS_TARGET/release/${{ matrix.binary }}" "desktop/binaries/yss-$env:YSS_TARGET$suffix"

      - name: Compile the desktop application
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # Candidate builds deliberately omit update signatures and OS code signing.
          # Only a separately authorized signed and verified build may be released.
          $config = Join-Path $env:RUNNER_TEMP 'yss-desktop-ci.json'
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding utf8NoBOM $config
          Push-Location desktop
          try {
            $tauri = Join-Path $env:RUNNER_TEMP 'tauri-cli/node_modules/@tauri-apps/cli/tauri.js'
            node $tauri build --ci --no-sign --no-bundle --target $env:YSS_TARGET --config $config -- --locked
          } finally {
            Pop-Location
          }

      - name: Package the unsigned desktop candidate
        working-directory: desktop
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $config = Join-Path $env:RUNNER_TEMP 'yss-desktop-ci.json'
          $tauri = Join-Path $env:RUNNER_TEMP 'tauri-cli/node_modules/@tauri-apps/cli/tauri.js'
          node $tauri bundle --ci --no-sign --target $env:YSS_TARGET --bundles ${{ matrix.bundle }} --config $config

      - name: Record candidate provenance and checksum
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $metadata = cargo metadata --manifest-path desktop/Cargo.toml --locked --no-deps --format-version 1 | ConvertFrom-Json
          $bundle = Join-Path $metadata.target_directory "$env:YSS_TARGET/release/bundle/${{ matrix.bundle }}"
          $packages = @(Get-ChildItem $bundle -Filter '*.${{ matrix.extension }}' -File)
          if ($packages.Count -ne 1) { throw 'Expected exactly one desktop candidate installer' }
          $payload = Join-Path $env:RUNNER_TEMP 'desktop-candidate-payload'
          New-Item -ItemType Directory $payload | Out-Null
          if ($IsWindows) {
            & (Join-Path $env:ProgramFiles '7-Zip/7z.exe') x '-tNSIS' '-y' "-o$payload" $packages[0].FullName '${{ matrix.binary }}' '-r'
          } else {
            hdiutil attach -readonly -nobrowse -quiet -mountpoint $payload $packages[0].FullName
          }
          try {
            $sidecars = @(Get-ChildItem -LiteralPath $payload -Recurse -File -Filter '${{ matrix.binary }}' | Where-Object Name -eq '${{ matrix.binary }}')
            if ($sidecars.Count -ne 1) { throw 'Expected exactly one packaged YSS sidecar' }
            $sidecar = $sidecars[0]
            $sidecarBytes = $sidecar.Length
            $sidecarDigest = (Get-FileHash -LiteralPath $sidecar.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($sidecarDigest -cne (Get-FileHash "target/$env:YSS_TARGET/release/${{ matrix.binary }}" -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'Packaged YSS digest differs from the fresh build' }
            if ($IsWindows) {
              $reader = [IO.BinaryReader]::new([IO.File]::OpenRead($sidecar.FullName))
              try {
                if ($reader.ReadUInt16() -ne 0x5a4d) { throw 'Packaged YSS is not a PE executable' }
                $reader.BaseStream.Position = 0x3c
                $peOffset = $reader.ReadUInt32()
                $reader.BaseStream.Position = $peOffset
                if ($reader.ReadUInt32() -ne 0x00004550 -or $reader.ReadUInt16() -ne 0x8664) { throw 'Packaged YSS is not an x64 PE executable' }
              } finally { $reader.Dispose() }
            } elseif ((lipo -archs $sidecar.FullName).Trim() -cne 'arm64') {
              throw 'Packaged YSS is not an ARM64 Mach-O executable'
            }
            $buildJson = & $sidecar.FullName version --json
          } finally {
            if ($IsMacOS) { hdiutil detach -quiet $payload }
          }
          $build = $buildJson | ConvertFrom-Json
          $cliMetadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $cliPackage = @($cliMetadata.packages | Where-Object Name -eq 'yss-cli')
          $bundleBuild = Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'bundle-build.json') | ConvertFrom-Json
          if ($cliPackage.Count -ne 1 -or $build.status -cne 'ok' -or $build.result.version -cne $cliPackage[0].version -or $build.result.target -cne $env:YSS_TARGET -or $build.result.source.commit -cne $env:GITHUB_SHA -or $build.result.source.state -cne 'committed' -or $build.result.bundleDigest -cne $bundleBuild.sha256) { throw 'Packaged YSS version, source or template digest mismatch' }
          $desktopPackage = @($metadata.packages | Where-Object Name -eq 'yss-desktop')
          $config = Get-Content -Raw desktop/tauri.conf.json | ConvertFrom-Json
          if ($desktopPackage.Count -ne 1 -or $desktopPackage[0].version -cne $config.version) { throw 'Cargo and Tauri desktop versions differ' }
          $allowDowngrades = $config.bundle.windows.allowDowngrades
          if ($allowDowngrades -isnot [bool] -or $allowDowngrades) { throw 'The desktop bundle must disable Windows downgrades' }

          New-Item -ItemType Directory dist/desktop -Force | Out-Null
          Copy-Item $packages[0].FullName dist/desktop/
          Copy-Item (Join-Path $env:RUNNER_TEMP 'bundle-build.json') dist/desktop/
          $copied = Join-Path 'dist/desktop' $packages[0].Name
          $checksum = (Get-FileHash $copied -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $($packages[0].Name)" | Set-Content -Encoding utf8NoBOM dist/desktop/SHA256SUMS
          $buildJson | Set-Content -Encoding utf8NoBOM dist/desktop/yss-build.json
          @{
            gitCommit = $env:GITHUB_SHA
            templateCommit = $env:YSS_TEMPLATE_COMMIT
            target = $env:YSS_TARGET
            desktopVersion = $config.version
            tauriCliVersion = $env:TAURI_CLI_VERSION
            rustc = (rustc --version).Trim()
            sidecarRustflags = $env:YSS_SIDECAR_RUSTFLAGS
            sidecarSha256 = $sidecarDigest
            sidecarBytes = $sidecarBytes
            installerBytes = $packages[0].Length
            signed = $false
            notarized = $false
          } |
            ConvertTo-Json | Set-Content -Encoding utf8NoBOM dist/desktop/candidate.json

      - name: Upload unsigned candidate and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-candidate-${{ matrix.target }}
          path: dist/desktop/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Exclude the local YSS path dependency from the desktop cache
        run: |
          # The desktop workspace treats the parent YSS CLI crate as an external dependency.
          $PSNativeCommandUseErrorActionPreference = $true
          cargo clean --locked --manifest-path desktop/Cargo.toml --package yss-cli --release --target $env:YSS_TARGET
