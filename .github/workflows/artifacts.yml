name: Build and generated artifacts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifacts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli-source
    steps:
      - uses: actions/checkout@v5
        with:
          path: cli-source
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli-source/go.mod
          cache-dependency-path: cli-source/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve fixed template commit
        id: source
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const commit=JSON.parse(fs.readFileSync('docs/source-lock.json')).profiles.spec.templateCommit;
          if(!/^[a-f0-9]{40}$/.test(commit)) throw new Error('fixed source required');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`commit=${commit}\n`);
          JS
      - uses: actions/checkout@v5
        with:
          repository: iloveZzz/yss-spec-project-template
          ref: ${{ steps.source.outputs.commit }}
          path: template-source
          fetch-depth: 1
          submodules: false
      - name: Fetch exact Profile and shared Skill objects
        run: |
          git -C "$GITHUB_WORKSPACE/template-source" submodule update --init --depth 1 -- submodules/yss-harness-design-agent submodules/yss-harness-backend-agent submodules/yss-harness-frontend-agent
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          const root=path.join(process.env.GITHUB_WORKSPACE,'template-source');
          const lock=JSON.parse(fs.readFileSync('docs/source-lock.json'));
          for(const source of Object.values(lock.profiles)) for(const item of [source,source.skillsSource].filter(Boolean)) {
            if(!/^[a-f0-9]{40}$/.test(item.templateCommit)) throw new Error('full fixed commit required');
            const repo=path.resolve(root,item.sourcePath);
            if(path.relative(root,repo).split(path.sep).includes('..')) throw new Error('source path escape');
            execFileSync('git',['-C',repo,'fetch','--depth','1','origin',item.templateCommit],{stdio:'inherit'});
          }
          JS
      - name: Compile production packages and record candidate
        env:
          CGO_ENABLED: 0
        run: |
          go build ./...
          node tools/build-candidate.mjs --out "$RUNNER_TEMP/yss-candidate"
      - name: Rebuild and compare all generated artifacts
        run: node tools/artifacts.mjs check --scope all --source-root "$GITHUB_WORKSPACE/template-source" --out "$RUNNER_TEMP/yss-artifacts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-and-generated-artifacts
          path: |
            ${{ runner.temp }}/yss-candidate/build-receipt.json
            ${{ runner.temp }}/yss-artifacts/receipt.json
            ${{ runner.temp }}/yss-artifacts/*.log
