name: Build and generated artifacts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifacts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli-source
    steps:
      - uses: actions/checkout@v5
        with:
          path: cli-source
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli-source/go.mod
          cache-dependency-path: cli-source/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve fixed template commit
        id: source
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const commit=JSON.parse(fs.readFileSync('docs/source-lock.json')).profiles.spec.templateCommit;
          if(!/^[a-f0-9]{40}$/.test(commit)) throw new Error('fixed source required');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`commit=${commit}\n`);
          JS
      - uses: actions/checkout@v5
        with:
          repository: iloveZzz/yss-spec-project-template
          ref: ${{ steps.source.outputs.commit }}
          path: template-source
          fetch-depth: 1
          submodules: false
      - name: Produce embedded bundle archive (not stored in git)
        run: node tools/fetch-bundle.mjs --source-root "$GITHUB_WORKSPACE/template-source"
      - name: Compile production packages and record candidate
        env:
          CGO_ENABLED: 0
        run: |
          go build ./...
          node tools/build-candidate.mjs --out "$RUNNER_TEMP/yss-candidate"
      - name: Check gofmt and go vet
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未经 gofmt 格式化:"
            echo "$unformatted"
            exit 1
          fi
          # internal/governance 既有 unkeyed 复合字面量告警，不为此改业务代码，故关闭 composites 分析器；其余分析器全部保留。
          go vet -composites=false ./...
          # 治理规则以 Go 语义为准：不允许把 Node 脚本字节的摘要写成 Go 常量
          node tools/check-no-pinned-digests.mjs
      - name: Go unit and integration tests (5 minute cap)
        timeout-minutes: 5
        env:
          CGO_ENABLED: 0
          YSS_TEST_REQUIRE_GIT: 1
        run: |
          git --version
          go test -timeout 5m -coverpkg=./internal/... -coverprofile="$RUNNER_TEMP/cover.out" ./...
          # 覆盖率只设棘轮下限：补测试后上调，不下调。数值见 docs/ci-verification.md。
          total="$(go tool cover -func="$RUNNER_TEMP/cover.out" | awk '/^total:/ {sub("%","",$NF); print $NF}')"
          echo "internal 语句覆盖率 ${total}%"
          awk -v t="$total" -v floor=10 'BEGIN { exit !(t+0 >= floor) }' || { echo "覆盖率 ${total}% 低于下限 10%"; exit 1; }
      - name: Black-box smoke of the built binary
        env:
          CGO_ENABLED: 0
        run: |
          go build -o "$RUNNER_TEMP/yss-smoke/yss" ./cmd/yss
          node tools/smoke/main.mjs --bin "$RUNNER_TEMP/yss-smoke/yss"
      - name: Rebuild and compare all generated artifacts
        run: node tools/artifacts.mjs check --scope all --source-root "$GITHUB_WORKSPACE/template-source" --out "$RUNNER_TEMP/yss-artifacts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-and-generated-artifacts
          path: |
            ${{ runner.temp }}/yss-candidate/build-receipt.json
            ${{ runner.temp }}/yss-artifacts/receipt.json
            ${{ runner.temp }}/yss-artifacts/*.log
