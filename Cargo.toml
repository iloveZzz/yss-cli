[package]
name = "yss-cli"
version = "3.4.0"
edition = "2024"
rust-version = "1.99"
autobins = false
default-run = "yss"

[lib]
name = "yss"

[[bin]]
name = "yss"
path = "src/bin/yss.rs"

[[bin]]
name = "yss-bundle"
path = "src/bin/yss-bundle.rs"

[dependencies]
cap-std = "4"
cap-fs-ext = "4"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde_path_to_error = "0.1"
saphyr-parser = "0.3.3"
sha2 = "0.10"
thiserror = "2"
tokio-util = "0.7"
unicode-normalization = "0.1"
getrandom = "0.3"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
time = { version = "0.3", features = ["formatting", "parsing"] }

semver = { version = "1", features = ["serde"] }
zip = { version = "9.2.1", default-features = false, features = ["deflate-flate2"] }
object = { version = "0.40", default-features = false, features = ["read_core", "std", "elf", "macho", "pe"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt", "time", "macros", "net"] }
directories = "6.0.0"
axum = "0.8.9"
rust-embed = { version = "8.14.0", features = ["debug-embed"] }
webbrowser = "1.2.7"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Wdk_Storage_FileSystem"] }

[build-dependencies]
sha2 = "0.10"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
