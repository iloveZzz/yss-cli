itlab-org/gitlab`}],zh=`从启动器打开已有工作区时，编辑区会先出现一帧浅色背景，再恢复上次使用的深色主题。连续打开两个窗口时，第二个窗口更容易出现。

## 复现步骤

1. 将工作区切换到深色主题，保留两个编辑器标签页。
2. 完全退出应用，再从启动器打开同一工作区。
3. 在文件树加载完成前观察编辑区的背景。

> 录屏中的“潮汐窗口”是观察员标记的闪屏时段。侧栏和状态栏在这段时间内颜色稳定。

## 观察记录

| 场景 | 观察结果 |
| --- | --- |
