workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - when: always

stages: [bundle, build]
default:
  image: docker.io/library/rust:1.99.1-trixie@sha256:09027f873d45b8ecd1dc86f1fa13b7a62b875c961f017a0e331267b350430137
  tags: [yss-linux]
variables:
  GIT_DEPTH: "0"
  YSS_GITLAB_CA_FILE: /etc/gitlab-runner/certs/gitlab.yss.test.crt
  YSS_GITLAB_CI_AUTH: "1"
  YSS_TEMPLATE_COMMIT: "1a2aee4270f96cd923724a09eeeef5b3fd09d60a"
  # Functional template source with Frontend starter; verify overrides before using artifacts.
cache:
  key:
    prefix: rust-1.99.1-$CI_JOB_NAME
    files: [Cargo.lock, rust-toolchain.toml]
  paths: [target/]

bundle-source:
  stage: bundle
  script:
    - |
      set -eu
      test "$CI_SERVER_URL" = https://gitlab.yss.test:9443
      test "$YSS_GITLAB_CI_AUTH" = 1
      test "$YSS_GITLAB_CA_FILE" = /etc/gitlab-runner/certs/gitlab.yss.test.crt
      test -s "$YSS_GITLAB_CA_FILE"
      test -n "$CI_JOB_TOKEN"
      rustc --version
      git --version
      test "$(rustc --version | cut -d ' ' -f 2)" = 1.99.1
      git_version=$(git --version | cut -d ' ' -f 3)
      test "$(printf '%s\n' 2.44.0 "$git_version" | sort -V | head -n 1)" = 2.44.0
      test "${YSS_TEMPLATE_COMMIT:-}" != "" || { echo "Set YSS_TEMPLATE_COMMIT to an actual committed Rust-ready template revision"; exit 1; }
      case "$YSS_TEMPLATE_COMMIT" in *[!0-9a-f]*|?????????????????????????????????????????*) exit 1;; esac
      test "${#YSS_TEMPLATE_COMMIT}" = 40
      work=$(mktemp -d)
      trap 'rm -rf "$work"' EXIT
      export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
      export GIT_CONFIG_COUNT=1
      export GIT_CONFIG_KEY_0=http.followRedirects GIT_CONFIG_VALUE_0=false
      python3 -I - <<'PYCODE'
      import json, os, re, ssl, urllib.request
      origin = "https://gitlab.yss.test:9443"
      project = "yss/yss-cli"
      class NoRedirect(urllib.request.HTTPRedirectHandler):
          def redirect_request(self, *args, **kwargs):
              return None
      def unique_fields(pairs):
          result = {}
          for key, value in pairs:
              if key in result:
                  raise ValueError("duplicate job metadata field")
              result[key] = value
          return result
      try:
          job_id = os.environ["CI_JOB_ID"]
          commit = os.environ["CI_COMMIT_SHA"]
          if not re.fullmatch(r"[1-9][0-9]*", job_id) or not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise ValueError("invalid tested job identity")
          context = ssl.create_default_context(cafile=os.environ["YSS_GITLAB_CA_FILE"])
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect(), urllib.request.HTTPSHandler(context=context))
          endpoint = origin + "/api/v4/job"
          req = urllib.request.Request(endpoint, headers={"JOB-TOKEN": os.environ["CI_JOB_TOKEN"]})
          with opener.open(req, timeout=30) as response:
              if response.status != 200 or response.geturl() != endpoint:
                  raise ValueError("unexpected job response")
              raw = response.read(262145)
          if len(raw) > 262144:
              raise ValueError("job metadata too large")
          record = json.loads(raw, object_pairs_hook=unique_fields)
          if type(record["id"]) is not int or record["id"] != int(job_id):
              raise ValueError("job ID mismatch")
          if record["web_url"] != origin + "/" + project + "/-/jobs/" + job_id:
              raise ValueError("job project URL mismatch")
          pipeline = record["pipeline"]
          if type(pipeline["project_id"]) is not int or pipeline["project_id"] <= 0 or pipeline["sha"] != commit:
              raise ValueError("tested pipeline identity mismatch")
      except Exception:
          raise SystemExit("Fixed GitLab job identity/CA/auth not ready; no fallback") from None
      PYCODE
      git init "$work/source"
      git -C "$work/source" remote add origin https://github.com/iloveZzz/yss-spec-project-template.git
      git -C "$work/source" fetch --depth 1 origin "$YSS_TEMPLATE_COMMIT"
      git -C "$work/source" checkout --detach FETCH_HEAD
      test "$(git -C "$work/source" rev-parse HEAD)" = "$YSS_TEMPLATE_COMMIT"
      mkdir -p ci-report assets
      cargo run --locked --bin yss-bundle -- --source-root "$work/source" --out assets/bundle.tar.gz > ci-report/bundle.json
      cargo fmt --all -- --check
      cargo clippy --locked --all-targets -- -D warnings
      printf '%s\n' "$YSS_TEMPLATE_COMMIT" > ci-report/template-commit.txt
      printf '%s\n' 'Each native job proves only its own target. Missing runner variables leave those targets unverified. No Release is published.' > ci-report/scope.txt
  artifacts:
    paths: [assets/bundle.tar.gz, ci-report/]
    expire_in: 7 days

.native-posix:
  stage: build
  needs: [bundle-source]
  script:
    - |
      set -eu
      test "$(rustc --version | cut -d ' ' -f 2)" = 1.99.1
      test "$(rustc -vV | sed -n 's/^host: //p')" = "$YSS_NATIVE_HOST"
      if [ "$YSS_TARGET" = aarch64-unknown-linux-musl ] || [ "$YSS_TARGET" = x86_64-unknown-linux-musl ]; then
        apt-get update -qq
        apt-get install -y --no-install-recommends musl-tools
        export CC=musl-gcc
        export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
        export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
      fi
      rustup target add "$YSS_TARGET"
      cargo build --locked --release --bin yss --target "$YSS_TARGET"
      program="$CI_PROJECT_DIR/target/$YSS_TARGET/release/yss"
      work=$(mktemp -d)
      work=$(cd "$work" && pwd -P)
      trap 'rm -rf "$work"' EXIT
      mkdir -p dist ci-report
      "$program" version --json > ci-report/version.json
      "$program" help --json > ci-report/help.json
      "$program" scaffold catalog --json > ci-report/catalog.json
      "$program" init --root "$work/preview" --profile spec --installation skills --dry-run --json > ci-report/preview.json
      test ! -e "$work/preview"
      "$program" init --root "$work/project" --profile spec --installation skills --json > ci-report/init.json
      "$program" sync --root "$work/project" --json > ci-report/sync.json
      "$program" doctor --root "$work/project" --json > ci-report/doctor.json
      version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
      archive="dist/yss_${version}_${YSS_TARGET}.tar.gz"
      cargo run --locked --bin yss-bundle -- package --binary "$program" --version "$version" --target "$YSS_TARGET" --out "$archive" > ci-report/package.json
      if command -v sha256sum >/dev/null; then digest=$(sha256sum "$archive" | cut -d ' ' -f 1); else digest=$(shasum -a 256 "$archive" | cut -d ' ' -f 1); fi
      printf '%s  %s\n' "$digest" "$(basename "$archive")" > dist/SHA256SUMS
      "$program" upgrade --artifact "$CI_PROJECT_DIR/$archive" --sha256 "$digest" --tool-root "$work/tool" --dry-run --json > ci-report/upgrade.json
      test ! -e "$work/tool"
      uname -a > ci-report/native-environment.txt
  artifacts:
    paths: [dist/, ci-report/]
    expire_in: 7 days

linux-arm64:
  extends: .native-posix
  variables:
    YSS_NATIVE_HOST: aarch64-unknown-linux-gnu
    YSS_TARGET: aarch64-unknown-linux-musl

linux-x86_64:
  extends: .native-posix
  tags: ['$YSS_RUNNER_LINUX_X86_64']
  rules:
    - if: '$YSS_RUNNER_LINUX_X86_64'
  variables:
    YSS_NATIVE_HOST: x86_64-unknown-linux-gnu
    YSS_TARGET: x86_64-unknown-linux-musl

macos-arm64:
  extends: .native-posix
  tags: ['$YSS_RUNNER_MACOS_ARM64']
  rules:
    - if: '$YSS_RUNNER_MACOS_ARM64'
  variables:
    YSS_NATIVE_HOST: aarch64-apple-darwin
    YSS_TARGET: aarch64-apple-darwin

macos-x86_64:
  extends: .native-posix
  tags: ['$YSS_RUNNER_MACOS_X86_64']
  rules:
    - if: '$YSS_RUNNER_MACOS_X86_64'
  variables:
    YSS_NATIVE_HOST: x86_64-apple-darwin
    YSS_TARGET: x86_64-apple-darwin

.native-windows:
  stage: build
  needs: [bundle-source]
  script:
    - |
      $ErrorActionPreference = 'Stop'
      if (((rustc --version) -split ' ')[1] -ne '1.99.1') { throw 'Rust version mismatch' }
      if ((rustc -vV | Select-String '^host: ').ToString().Substring(6) -ne $env:YSS_TARGET) { throw 'Native host mismatch' }
      $env:RUSTFLAGS = '-C target-feature=+crt-static'
      cargo build --locked --release --bin yss --target $env:YSS_TARGET
      if ($LASTEXITCODE) { throw 'Build failed' }
      Remove-Item Env:RUSTFLAGS
      $program = Join-Path $pwd "target/$env:YSS_TARGET/release/yss.exe"
      $work = Join-Path ([IO.Path]::GetTempPath()) ([Guid]::NewGuid().ToString())
      New-Item -Type Directory $work,dist,ci-report -Force | Out-Null
      try {
        & $program version --json | Set-Content ci-report/version.json
        if ($LASTEXITCODE) { throw 'Version failed' }
        & $program scaffold catalog --json | Set-Content ci-report/catalog.json
        if ($LASTEXITCODE) { throw 'Catalog failed' }
        & $program init --root "$work/project" --profile spec --installation skills --json | Set-Content ci-report/init.json
        if ($LASTEXITCODE) { throw 'Init failed' }
        & $program sync --root "$work/project" --json | Set-Content ci-report/sync.json
        if ($LASTEXITCODE) { throw 'Sync failed' }
        $version = [regex]::Match((Get-Content Cargo.toml -Raw),'(?m)^version = "([^"]+)"$').Groups[1].Value
        $archive = "dist/yss_${version}_$env:YSS_TARGET.zip"
        cargo run --locked --bin yss-bundle -- package --binary $program --version $version --target $env:YSS_TARGET --out $archive | Set-Content ci-report/package.json
        if ($LASTEXITCODE) { throw 'Package failed' }
        $digest = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
        "$digest  $([IO.Path]::GetFileName($archive))" | Set-Content -Encoding ascii dist/SHA256SUMS
        & $program upgrade --artifact (Join-Path $pwd $archive) --sha256 $digest --tool-root "$work/tool" --dry-run --json | Set-Content ci-report/upgrade.json
        if ($LASTEXITCODE -or (Test-Path "$work/tool")) { throw 'Offline preview failed' }
        [Environment]::OSVersion.ToString() | Set-Content ci-report/native-environment.txt
      } finally { Remove-Item -Recurse -Force $work }
  artifacts:
    paths: [dist/, ci-report/]
    expire_in: 7 days

windows-x86_64:
  extends: .native-windows
  tags: ['$YSS_RUNNER_WINDOWS_X86_64']
  rules:
    - if: '$YSS_RUNNER_WINDOWS_X86_64'
  variables:
    YSS_TARGET: x86_64-pc-windows-msvc

windows-arm64:
  extends: .native-windows
  tags: ['$YSS_RUNNER_WINDOWS_ARM64']
  rules:
    - if: '$YSS_RUNNER_WINDOWS_ARM64'
  variables:
    YSS_TARGET: aarch64-pc-windows-msvc
