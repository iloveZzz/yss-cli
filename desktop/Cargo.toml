[package]
name = "yss-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
directories = "6"
getrandom = "0.3"
hmac = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "blocking"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
semver = "1"
subtle = "2.6"
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2.6"
tauri-plugin-updater = "=2.14.1"
tauri-plugin-single-instance = "2"
url = "2"
webbrowser = "1"
webpki-roots = "1"
zip = { version = "9.2.1", default-features = false, features = ["deflate-flate2"] }
yss = { package = "yss-cli", path = ".." }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
flate2 = "1"
objc2 = "0.6"
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKFrameInfo", "WKNavigationAction", "WKNavigationDelegate", "WKWebView"] }
tar = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
