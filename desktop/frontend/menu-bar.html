<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YSS 工作台 · 菜单栏</title>
  <link rel="stylesheet" href="menu-bar.css">
  <script src="menu-bar.js" defer></script>
</head>
<body>
  <main class="panel" aria-labelledby="title">
    <header class="panel-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">Y</span>
        <h1 id="title">YSS 工作台</h1>
      </div>
      <div class="tools" role="group" aria-label="常用操作">
        <button id="refresh" class="icon-button" type="button" title="刷新状态" aria-label="刷新状态">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 10a8 8 0 1 0-2.2 7.6M20 4v6h-6"/>
          </svg>
        </button>
        <button class="icon-button" type="button" data-action="workbench" title="打开工作台" aria-label="打开工作台">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5M14 4h6v6m0-6-9 9"/>
          </svg>
        </button>
        <button class="icon-button" type="button" data-action="settings" title="桌面设置" aria-label="桌面设置">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 3h4l.5 2.5 1.7 1L19 6l2 3.5-1.8 1.8v1.4l1.8 1.8-2 3.5-2.8-.5-1.7 1L14 21h-4l-.5-2.5-1.7-1L5 18l-2-3.5 1.8-1.8v-1.4L3 9.5 5 6l2.8.5 1.7-1L10 3Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="panel-body">
      <section class="connection" aria-label="服务连接">
        <div id="connection" class="connection-title" data-state="loading">
          <span class="connection-dot" aria-hidden="true"></span>
          <strong id="connection-title">工作台状态</strong>
        </div>
        <p id="connection-description">正在读取连接…</p>
      </section>

      <section class="activity" aria-labelledby="activity-title" aria-busy="true">
        <div class="activity-heading">
          <h2 id="activity-title">作业概览</h2>
          <span id="service-version" hidden></span>
        </div>
        <dl id="counts" hidden>
          <div class="activity-row">
            <dt>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>
              <span>执行中</span>
            </dt>
            <dd id="running">—</dd>
          </div>
          <div class="activity-row">
            <dt>
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4m0 4h.01"/></svg>
              <span>待处理</span>
            </dt>
            <dd id="attention">—</dd>
          </div>
          <div class="activity-row">
            <dt>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
              <span>排队</span>
            </dt>
            <dd id="queued">—</dd>
          </div>
        </dl>
        <p id="activity-note" class="empty-state">正在读取作业…</p>
      </section>

      <p id="action-error" class="action-error" role="alert" hidden></p>
      <p id="announcement" class="visually-hidden" role="status"></p>
    </div>

    <footer class="panel-footer">
      <span id="updated">尚未更新</span>
      <button class="exit-button" type="button" data-action="exit">退出…</button>
    </footer>
  </main>
</body>
</html>
