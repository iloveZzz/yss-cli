<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YSS 工作台 · 菜单栏</title>
  <link rel="stylesheet" href="menu-bar.css">
  <script src="menu-bar.js" defer></script>
</head>
<body>
  <main class="panel" aria-labelledby="title">
    <header class="panel-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">Y</span>
        <h1 id="title">YSS 工作台</h1>
      </div>
      <div class="tools" role="group" aria-label="常用操作">
        <button id="refresh" class="icon-button" type="button" title="刷新状态" aria-label="刷新状态">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 10a8 8 0 1 0-2.2 7.6M20 4v6h-6"/>
          </svg>
        </button>
        <button class="icon-button" type="button" data-action="workbench" title="打开工作台" aria-label="打开工作台">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5M14 4h6v6m0-6-9 9"/>
          </svg>
        </button>
        <button class="icon-button" type="button" data-action="settings" title="桌面设置" aria-label="桌面设置">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 3h4l.5 2.5 1.7 1L19 6l2 3.5-1.8 1.8v1.4l1.8 1.8-2 3.5-2.8-.5-1.7 1L14 21h-4l-.5-2.5-1.7-1L5 18l-2-3.5 1.8-1.8v-1.4L3 9.5 5 6l2.8.5 1.7-1L10 3Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="panel-body">
      <section class="connection" aria-label="服务连接">
        <div id="connection" class="connection-title" data-state="loading">
          <span class="connection-dot" aria-hidden="true"></span>
          <strong id="connection-title">工作台状态</strong>
        </div>
        <p id="connection-description">正在读取连接…</p>
        <span id="service-version" hidden></span>
      </section>

      <article class="summary-card spec-overview" aria-labelledby="spec-title" aria-busy="true">
        <header class="card-heading">
          <h2 id="spec-title">Spec 概览</h2>
          <p class="card-meta spec-status">正在读取…</p>
        </header>
        <div class="spec-todos" role="group" aria-label="Spec 待办">
          <button class="spec-action" type="button" data-action="specOverview" data-scope="pendingConfirmation" disabled>
            <span>待确认</span><span class="spec-count">—</span>
          </button>
          <button class="spec-action" type="button" data-action="specOverview" data-scope="pendingVerification" disabled>
            <span>待核实</span><span class="spec-count">—</span>
          </button>
          <button class="spec-action" type="button" data-action="specOverview" data-scope="pendingHandling" disabled>
            <span>待处理</span><span class="spec-count">—</span>
          </button>
        </div>
        <div class="spec-stages" role="group" aria-label="Spec 推进阶段">
          <button class="spec-action" type="button" data-action="specOverview" data-scope="research" disabled>
            <span>调研</span><span class="spec-count">—</span>
          </button>
          <button class="spec-action" type="button" data-action="specOverview" data-scope="analysis" disabled>
            <span>分析</span><span class="spec-count">—</span>
          </button>
          <button class="spec-action" type="button" data-action="specOverview" data-scope="spec" disabled>
            <span>规格</span><span class="spec-count">—</span>
          </button>
          <button class="spec-action" type="button" data-action="specOverview" data-scope="prototype" disabled>
            <span>原型</span><span class="spec-count">—</span>
          </button>
          <button class="spec-action" type="button" data-action="specOverview" data-scope="handoff" disabled>
            <span>交接</span><span class="spec-count">—</span>
          </button>
          <button class="spec-action" type="button" data-action="specOverview" data-scope="implementation" disabled>
            <span>实施</span><span class="spec-count">—</span>
          </button>
          <button class="spec-action" type="button" data-action="specOverview" data-scope="verification" disabled>
            <span>验证</span><span class="spec-count">—</span>
          </button>
          <button class="spec-action" type="button" data-action="specOverview" data-scope="delivery" disabled>
            <span>目标结果核实</span><span class="spec-count">—</span>
          </button>
        </div>
      </article>

      <div class="summary-grid">
        <article class="summary-card" aria-labelledby="project-title">
          <header class="card-heading">
            <h2 id="project-title">工程统计</h2>
            <p id="project-total" class="card-meta">尚未读取</p>
          </header>
          <dl class="metrics">
            <div>
              <dt>已启用</dt>
              <dd id="project-active">—</dd>
            </div>
            <div>
              <dt>已停用</dt>
              <dd id="project-inactive">—</dd>
            </div>
          </dl>
        </article>
        <article class="summary-card" aria-labelledby="merge-title">
          <header class="card-heading">
            <h2 id="merge-title">PR / MR</h2>
            <p id="merge-status" class="card-meta">本机已关联</p>
          </header>
          <dl class="metrics">
            <div>
              <dt>GitHub PR</dt>
              <dd id="merge-github">—</dd>
            </div>
            <div>
              <dt>GitLab MR</dt>
              <dd id="merge-gitlab">—</dd>
            </div>
          </dl>
        </article>
      </div>

      <p id="announcement" class="visually-hidden" role="status"></p>
    </div>

    <footer class="panel-footer">
      <div class="footer-status">
        <p id="action-error" class="action-error" role="alert" hidden></p>
        <span id="updated">尚未更新</span>
      </div>
      <button class="exit-button" type="button" data-action="exit">退出…</button>
    </footer>
  </main>
</body>
</html>
